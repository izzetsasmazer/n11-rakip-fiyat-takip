name: N11 bagimsiz fiyat kontrolu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/n11-bagimsiz-takip.yml
permissions:
  contents: write
concurrency:
  group: n11-bagimsiz-takip
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scan visible N11 offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BATCH_SIZE: '8'
        run: python n11_watcher.py
      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n11-diagnostic
          path: n11-debug/
          if-no-files-found: ignore
          retention-days: 2
      - name: Store independent scan progress
        if: always()
        run: |
          if [ -f n11-independent-state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add n11-independent-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Save independent N11 scan progress [skip ci]"
              git push
            fi
          fi
